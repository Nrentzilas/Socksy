name: shellcheck

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          additional_files: 'socksy'
          # Shell completions are sourced by the completion system and use
          # shell-specific idioms; the zsh script in particular is not valid
          # sh/bash, so ShellCheck cannot analyze it.
          ignore_paths: completions
